[package]
name = "sim-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host executable that loads a FreeRTOS-native simulator configuration and runs it."

[features]
zephyr_real = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zephyr_linked)', 'cfg(zephyr_cc_kernel)'] }

[[bin]]
name = "sim-runner"
path = "src/main.rs"

[dependencies]
sim-core = { path = "../sim-core" }
sim-fiber = { path = "../sim-fiber" }
sim-ffi = { path = "../sim-ffi" }
sim-devices = { path = "../sim-devices" }
sim-net = { path = "../sim-net" }
sim-freertos-port = { path = "../sim-freertos-port" }
sim-zephyr-port = { path = "../sim-zephyr-port" }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
serde = { workspace = true }
toml = { workspace = true }
