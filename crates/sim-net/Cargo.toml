[package]
name = "sim-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Networking layer: deterministic smoltcp integration and optional host poller."

[dependencies]
sim-core = { path = "../sim-core" }
smoltcp = { workspace = true }
thiserror = { workspace = true }

# host_poller (interactive mode) uses Unix-specific std::os::fd types.
# polling is only needed on unix platforms where host_poller is compiled.
[target.'cfg(unix)'.dependencies]
polling = { workspace = true }
