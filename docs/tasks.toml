[[tasks]]
name = "Phase 32a: JSON-RPC server (costar serve)"
prompt = """
For the `/home/zmm/projects/costar` project, implement Phase 32a: the `costar serve` JSON-RPC 2.0 server subcommand.

Reference: `docs/IMPLEMENTATION_STATUS.md` §Phase 32a, `docs/HANDOFF.md`.

Requirements:
1. `costar serve [--bind <addr>] [--stdio]` subcommand in `crates/sim-runner/src/main.rs`
   - `--stdio` mode: reads newline-delimited JSON-RPC requests from stdin, writes responses to stdout
   - `--bind <addr>` mode: TCP listener (e.g. 127.0.0.1:9321)
2. Server manages multiple concurrent simulation sessions via session IDs (in-memory HashMap)
3. JSON-RPC 2.0 methods:
   - `session.create` → `{session_id, state: "idle"}`
   - `session.destroy {session_id}`
   - `session.list` → `[{session_id, state, n_machines, uptime_ticks}]`
   - `scenario.load {session_id, path}` → `{n_machines, n_links, n_injections}`
   - `scenario.load_inline {session_id, toml}` → same as load but from inline TOML string
   - `sim.run {session_id}` → `{exit_code, n_events, trace_jsonl: [...], duration_ms}`
   - `sim.run_until {session_id, deadline_ticks}` → partial results
   - `sim.step {session_id, n_ticks}` → `{state, now_ticks, new_events: [...]}`
   - `sim.status {session_id}` → `{state, now_ticks, n_machines}`
   - `sim.stop {session_id}` → halt a running simulation
   - `board.configure {session_id, config_toml}` → init virtual devices from board config
   - `trace.get {session_id, format}` → `{trace}`
   - `server.shutdown` → graceful shutdown
4. Standard JSON-RPC error codes (-32600 parse error, -32601 method not found, -32602 invalid params, -32000+ app errors)
5. `costar serve --json` prints startup metadata as JSON so clients can parse readiness
6. Unit tests: start server on random TCP port, exercise create→load→run→get-trace→destroy
7. Integration test: `costar serve --stdio` with piped JSON-RPC requests

Dependencies to add to `crates/sim-runner/Cargo.toml`:
- `serde_json` (already present)
- `tokio` with `net` and `io-util` features OR use std::net + threads for TCP listener

Directory: create `crates/sim-runner/src/serve.rs` for the server logic.

Commit with message: "feat: JSON-RPC server (costar serve) for mcu integration"
"""

