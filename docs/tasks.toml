[[tasks]]
name = "Phase 32f: Persistent session manager"
prompt = """
For the `/home/zmm/projects/costar` project, implement Phase 32f: persistent session management in the JSON-RPC server.

Reference: `docs/IMPLEMENTATION_STATUS.md` §Phase 32f.

Requirements:
1. Sessions survive across multiple RPC calls — no need to reload scenarios between runs
2. `session.clone {session_id}` → `{new_session_id}` — fork a session for A/B testing
3. `sim.reset {session_id}` — reset simulation state to post-load (virtual time = 0, machines idle, traces cleared) without reloading scenario
4. `trace.stream {session_id}` — SSE-style event stream: each trace entry pushed to client as it's recorded during a running simulation (use newline-delimited JSON over the same transport)
5. Session TTL: idle sessions auto-destroy after configurable timeout (default 5 minutes, configurable via `--session-ttl <seconds>`)
6. Unit tests: clone session produces independent simulation, reset clears state but preserves scenario, TTL expiry destroys idle sessions
7. Update `costar serve --help` to document the TTL flag

Commit with message: "feat: persistent session manager with clone/reset/stream/TTL"
"""

