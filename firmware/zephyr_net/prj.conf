CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_BOOT_BANNER=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_EEPROM=y
# Zephyr's own network stack on a costar,eth interface (not native_sim's
# offloaded host sockets), IPv4 only, with addresses set by the application.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
