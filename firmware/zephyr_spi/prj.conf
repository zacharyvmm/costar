CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_BOOT_BANNER=n
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y
# Erase pages of a sector (the default is a 64 KiB block), for NVS.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
# Small frames: longer transfers are split, within one transaction.
CONFIG_COSTAR_SPI_FRAME_SIZE=64
