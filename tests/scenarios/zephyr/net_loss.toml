# net.toml with a lossy link: the client's first ping to the server is
# dropped on the wire.  The client gives up waiting for its reply after
# 100 ms (at 101 ms: Zephyr adds a tick), then the second ping and the
# datagrams go through.
name = "zephyr-net-loss"
duration_ms = 120

[[machine]]
name = "client"
image = "zephyr_net.so"
devices = [{ name = "eth", kind = "channel", irq = 8 },
           { name = "eeprom", kind = "memory", size = 16 },
           { name = "entropy", kind = "registers" }]

[[machine]]
name = "server"
image = "zephyr_net.so"
devices = [{ name = "eth", kind = "channel", irq = 8 },
           { name = "eeprom", kind = "memory", size = 16 },
           { name = "entropy", kind = "registers" }]

[[wire]]
endpoints = ["client.eth", "server.eth"]
latency_us = 5
bits_per_second = 100000000
faults = [{ kind = "drop", from_us = 16, until_us = 17, match_hex = "ce 56 97 1c de 35" }]  # to the server

[[input]]
target = "client.eeprom"
write_hex = "c0 00 02 01  c0 00 02 02  01"   # 192.0.2.1, peer 192.0.2.2, client

[[input]]
target = "server.eeprom"
write_hex = "c0 00 02 02  c0 00 02 01  00"   # 192.0.2.2, peer 192.0.2.1

[[input]]
target = "client.entropy"
register = 0
value = 1

[[input]]
target = "server.entropy"
register = 0
value = 2

[expect]
trace = "net_loss.trace"
