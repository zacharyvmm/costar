# spi.toml's app, with the reply to the first frame of its hand-made
# transaction lost: the frame (chip select held) reached the flash, so the
# far side has chip select active.  The transceive times out (after
# CONFIG_SPI_COMPLETION_TIMEOUT_TOLERANCE, 200 ms) and releases the chip
# select at once, with a DESELECT frame of its own, rather than leave the
# flash's transaction open until the next one selects afresh.
name = "zephyr-spi-fault"
duration_ms = 400

[[machine]]
name = "mcu"
image = "zephyr_spi.so"
devices = [{ name = "spi0", kind = "channel", irq = 13 }]

[[machine]]
name = "board"
devices = [{ name = "spi", kind = "channel" },
           { name = "flash", kind = "memory", size = 1048576 }]

[[wire]]                   # 8 MHz; the reply to tag 4 (the held frame) is lost
endpoints = ["mcu.spi0", "board.spi"]
bits_per_second = 8000000
faults = [{ kind = "drop", match_hex = "00 04 00", until_us = 100 }]

[[model]]
type = "spi-nor"
bus = "board.spi"
chip_select = 0
memory = "board.flash"
jedec_id = 0xef4014        # a W25Q80: Winbond, 1 MiB
program_time_us = 700
erase_time_ms = 40

[expect]
trace = "spi_fault.trace"

[[expect.event]]
machine = "mcu"
label = "log"
text = "wrote 100 bytes across a page (0): read back"
