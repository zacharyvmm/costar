# The ramp plant writes 1, 2, 3 to the sensor at 0, 10 and 20 ms; the
# firmware answers each with twice the value, at once.
name = "mirror"
duration_ms = 25

[[machine]]
name = "board"
image = "mirror.so"
devices = [{ name = "sensor", kind = "registers", irq = 1 }]

[[plant]]
type = "ramp"
period_ms = 10
target = "board.sensor"

[[expect.event]]
label = "reg"
text = "sensor[1]=6"
after_ms = 20
before_ms = 20
