# A Zephyr machine on a Linux TAP interface: costar,eth and Zephyr's own
# network stack (firmware/zephyr_net) answering pings and echoing UDP at
# 192.0.2.1.  Create the interface once (this needs root):
#   sudo ip tuntap add dev costar0 mode tap user $USER
#   sudo ip addr add 192.0.2.2/24 dev costar0 && sudo ip link set costar0 up
# then run the scenario, and talk to the machine from the host:
#   build/costar run examples/zephyr/tap_bridge.toml --images build/firmware --until-ms 60000
#   ping 192.0.2.1
#   echo hello | nc -u -w1 192.0.2.1 7
name = "tap-bridge"

[[machine]]
name = "zephyr"
image = "zephyr_net.so"
devices = [{ name = "eth", kind = "channel", irq = 8 },
           { name = "eeprom", kind = "memory", size = 16 }]

[[input]]
target = "zephyr.eeprom"
write_hex = "c0 00 02 01  c0 00 02 02  00"   # 192.0.2.1, peer 192.0.2.2, not the client

[[bridge]]
endpoint = "zephyr.eth"
kind = "tap"
interface = "costar0"
