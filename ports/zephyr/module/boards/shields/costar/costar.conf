# printk and the console go to costar's log (native_sim's posix arch console),
# whether or not the application enables UART drivers.  Zephyr merges this
# after prj.conf, so an application that wants its console on a costar UART
# sets CONFIG_UART_CONSOLE=y and CONFIG_POSIX_ARCH_CONSOLE_INIT_PRIORITY=59 in
# an EXTRA_CONF_FILE, and chooses the UART in its overlay (see README.md).
CONFIG_UART_CONSOLE=n
CONFIG_POSIX_ARCH_CONSOLE=y
