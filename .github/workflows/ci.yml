name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout microcar dependency
        uses: actions/checkout@v4
        with:
          repository: zacharyvmm/microcar
          path: microcar

      - name: Move microcar to sibling directory
        shell: bash
        run: mv microcar ../microcar

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy (advisory)
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy-output.log; exit 0
        # Allow clippy to be advisory — C code has its own warnings.

      - name: Run tests
        run: cargo test --workspace

      - name: Golden trace test
        shell: bash
        run: bash tests/golden_trace_test.sh all

  sanitizers:
    name: Sanitizers (nightly, ${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout microcar dependency
        uses: actions/checkout@v4
        with:
          repository: zacharyvmm/microcar
          path: microcar

      - name: Move microcar to sibling directory
        shell: bash
        run: mv microcar ../microcar

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-san-${{ matrix.sanitizer }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-san-${{ matrix.sanitizer }}-

      - name: Run tests with ${{ matrix.sanitizer }} sanitizer
        env:
          RUSTFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"
          RUSTDOCFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"
          # ASan may report leaks from C code / system libs; allow the job
          # to pass with warnings and inspect logs for real issues.
          ASAN_OPTIONS: "detect_leaks=0"
        run: cargo test --workspace --target x86_64-unknown-linux-gnu 2>&1 | tee sanitizer-output.log; test ${PIPESTATUS[0]} -eq 0
        continue-on-error: true

  zephyr-real-check:
    name: Zephyr real feature (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout microcar dependency
        uses: actions/checkout@v4
        with:
          repository: zacharyvmm/microcar
          path: microcar

      - name: Move microcar to sibling directory
        shell: bash
        run: mv microcar ../microcar

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build with zephyr_real feature
        run: cargo build --workspace --features zephyr_real
        # ZEPHYR_BUILD_DIR not set → build.rs skips linking zephyr.elf.
        # This job verifies the feature-gated code compiles cleanly.

  zephyr-cc-build:
    name: Zephyr cc crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout microcar dependency
        uses: actions/checkout@v4
        with:
          repository: zacharyvmm/microcar
          path: microcar

      - name: Move microcar to sibling directory
        shell: bash
        run: mv microcar ../microcar

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Clang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y
        # Clang understands GNU C extensions that Zephyr uses.
        # The cc crate will pick it up via the CC=clang env var.

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-zephyr-cc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zephyr-cc-

      - name: Shallow clone Zephyr source
        shell: bash
        run: |
          git clone --depth 1 --branch v4.1.0 https://github.com/zephyrproject-rtos/zephyr.git /tmp/zephyr
        # Only need kernel source, arch headers, and a few board/soc files.
        # Shallow clone is ~150 MB; takes ~60s on CI runners.

      - name: Build with Zephyr cc crate
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --workspace --features zephyr_real
        env:
          ZEPHYR_BASE: /tmp/zephyr

      - name: Zephyr broader API golden trace test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/zephyr_broader_api_golden_test.sh
        env:
          ZEPHYR_BASE: /tmp/zephyr
          ZEPHYR_APP: broader_api

      - name: Build with Zephyr cc crate (Windows Clang)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --workspace --features zephyr_real
        env:
          ZEPHYR_BASE: /tmp/zephyr
          CC: clang

  msrv-check:
    name: MSRV check (1.84)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout microcar dependency
        uses: actions/checkout@v4
        with:
          repository: zacharyvmm/microcar
          path: microcar

      - name: Move microcar to sibling directory
        shell: bash
        run: mv microcar ../microcar

      - name: Install stable Rust toolchain (for tests)
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSRV Rust toolchain (1.84)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Test with stable
        run: cargo +stable test --workspace

      - name: Check with MSRV
        run: cargo +1.84 check --workspace
