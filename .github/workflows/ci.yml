name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libboost-context-dev gdb
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

      - name: Fetch Zephyr v4.5.0
        run: |
          git clone --depth 1 --branch v4.5.0 https://github.com/zephyrproject-rtos/zephyr.git "$RUNNER_TEMP/zephyr"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r "$RUNNER_TEMP/zephyr/scripts/requirements-base.txt"

      - name: Install the Python client's and twister's requirements
        run: '"$RUNNER_TEMP/venv/bin/pip" install grpcio grpcio-tools pytest natsort ply junitparser'

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCOSTAR_ZEPHYR_BASE="$RUNNER_TEMP/zephyr"
          -DCOSTAR_ZEPHYR_PYTHON="$RUNNER_TEMP/venv/bin/python"
          -DCOSTAR_BUILD_GRPC=ON
          -DCOSTAR_PYTHON="$RUNNER_TEMP/venv/bin/python"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)" --output-junit junit.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: build/junit.xml

      # Each failing scenario's trace, console text, golden diff and summary.
      - name: Upload failing scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-artifacts
          path: build/scenario-artifacts
          if-no-files-found: ignore

      # Upstream ztest suites, unmodified, under twister on costar's
      # native_sim/native/64/costar board.
      - name: Zephyr kernel suites under twister
        env:
          ZEPHYR_BASE: ${{ runner.temp }}/zephyr
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: >
          "$RUNNER_TEMP/venv/bin/python" "$ZEPHYR_BASE/scripts/twister"
          -p native_sim/native/64/costar --board-root ports/zephyr/module/boards
          -x ZEPHYR_MODULES="$PWD/ports/zephyr/module" -x COSTAR_EXECUTABLE="$PWD/build/costar"
          -T "$ZEPHYR_BASE/tests/kernel/semaphore/semaphore" -T "$ZEPHYR_BASE/tests/kernel/mutex/mutex_api"
          -T "$ZEPHYR_BASE/tests/kernel/msgq/msgq_api" -T "$ZEPHYR_BASE/tests/kernel/timer/timer_api"
          -O twister-out --inline-logs -j "$(nproc)"

      - name: Upload the twister report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister
          path: twister-out/twister_report.xml

      # The release tarball, for the action job.
      - name: Package
        run: tools/release/package.sh build dist

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist

  # The GitHub Action (action.yml), from this checkout, installing the
  # tarball built above on a runner without gRPC or a costar build.
  action:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist

      - id: tarball
        run: echo "path=$(ls dist/costar-*.tar.gz)" >>"$GITHUB_OUTPUT"

      - name: Install costar with the action
        id: costar
        uses: ./
        with:
          tarball: ${{ steps.tarball.outputs.path }}

      - name: Build examples/consumer with find_package(costar)
        run: |
          test "$(command -v costar)" = "${{ steps.costar.outputs.prefix }}/bin/costar"
          cmake -S examples/consumer -B consumer
          cmake --build consumer -j "$(nproc)"
          ctest --test-dir consumer --output-on-failure

      - name: Run a scenario with the action
        uses: ./
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          scenarios: examples/consumer/scenarios/inputs.toml
          images: consumer
          args: --timeout-s 60

      # A failing scenario fails the step, and its artifacts are uploaded.
      - name: Fail a scenario with the action
        id: failing
        continue-on-error: true
        uses: ./
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          scenarios: examples/consumer/scenarios/inputs.toml
          images: consumer
          args: --set input.1.value=4
          junit: failing.xml
          artifacts: failing
          artifact-name: action-failing-scenario

      - name: Check the failure
        if: steps.failing.outcome != 'failure' || hashFiles('failing/inputs-*/summary.txt') == ''
        run: |
          echo "::error::the failing scenario passed, or left no artifacts"
          exit 1

  # Everything built as 32-bit x86, so firmware runs with an MCU's ILP32 data
  # model (Zephyr images on board native_sim).  Boost.Context is fetched and
  # built 32-bit; there is no gRPC.
  build-32bit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-multilib g++-multilib

      - name: Fetch Zephyr v4.5.0
        run: |
          git clone --depth 1 --branch v4.5.0 https://github.com/zephyrproject-rtos/zephyr.git "$RUNNER_TEMP/zephyr"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r "$RUNNER_TEMP/zephyr/scripts/requirements-base.txt"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-i686.cmake
          -DCOSTAR_ZEPHYR_BASE="$RUNNER_TEMP/zephyr"
          -DCOSTAR_ZEPHYR_PYTHON="$RUNNER_TEMP/venv/bin/python"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

      - name: Upload failing scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-artifacts-32bit
          path: build/scenario-artifacts
          if-no-files-found: ignore

  # AddressSanitizer and UndefinedBehaviorSanitizer over the engine and the
  # FreeRTOS images; any finding fails the run.
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-context-dev gdb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCOSTAR_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

      - name: Upload failing scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-artifacts-sanitizers
          path: build/scenario-artifacts
          if-no-files-found: ignore

  # Line coverage of the engine, the ports and the test firmware.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-context-dev gcovr

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCOSTAR_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

      - name: Report
        run: |
          mkdir coverage
          # Counters are atomic (COSTAR_COVERAGE), so gcov shouldn't report
          # negative counts; if it ever does, warn rather than lose the report.
          gcovr --root . build --filter src/ --filter ports/ --filter firmware/ \
                --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
                --txt-summary --html-details coverage/index.html

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
